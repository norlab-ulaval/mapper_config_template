mapper:
  updateCondition:
    type: distance
    value: 1.0

  sensorMaxRange: 200

  mapperModule:
    - PointDistanceMapperModule:
        minDistNewPoint: 0.1

    - ComputeDynamicsMapperModule:
        thresholdDynamic: 0.65
        alpha: 0.2
        beta: 0.99
        beamHalfAngle: 0.01
        epsilonA: 0.01
        epsilonD: 0.01

input:
  - BoundingBoxDataPointsFilter:
      xMin: -1.5
      xMax: 0.5
      yMin: -1
      yMax: 1
      zMin: -1
      zMax: 0.5
      removeInside: 1

  - BoundingBoxDataPointsFilter:
      xMin: -6
      xMax: -1.5
      yMin: -2.5
      yMax: 2.5
      zMin: -1
      zMax: 1
      removeInside: 1

  - RandomSamplingDataPointsFilter:
      prob: 0.8

  - AddDescriptorDataPointsFilter:
      descriptorName: probabilityDynamic 
      descriptorDimension: 1
      descriptorValues: [0.6]

  - SamplingSurfaceNormalDataPointsFilter:
      ratio: 0.5
      knn: 7
      samplingMethod: 0
      maxBoxDim: inf
      averageExistingDescriptors: 1
      keepNormals: 1
      keepDensities: 0
      keepEigenValues: 0
      keepEigenVectors: 0

icp:
  readingDataPointsFilters:
    - RandomSamplingDataPointsFilter:
        prob: 0.8

  referenceDataPointsFilters:

  outlierFilters:
    - TrimmedDistOutlierFilter:
        ratio: 0.75

  matcher:
    KDTreeMatcher:
      knn: 3
      epsilon: 1
      searchType: 1
      maxDist: 200.0

  errorMinimizer:
    PointToPlaneErrorMinimizer:
      force4DOF: 1

  transformationCheckers:
    - CounterTransformationChecker:
        maxIterationCount: 40
    - DifferentialTransformationChecker:
        minDiffRotErr: 0.001
        minDiffTransErr: 0.001
        smoothLength: 3

  inspector: NullInspector

  logger: NullLogger

post:
  - SurfaceNormalDataPointsFilter:
      knn: 10

  - CutAtDescriptorThresholdDataPointsFilter:
      descName: probabilityDynamic
      useLargerThan: 1
      threshold: 0.65
